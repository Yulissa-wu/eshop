<!DOCTYPE html>
<!-- =============================================
     商品分類頁面
     創建時間: 2024
     功能: 商品分類展示
     ============================================= -->
<html lang="zh-TW">
<head>
    <!-- 頁面基本設定 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品分類 - EShop 系統</title>
    
    <!-- 引入 CSS 樣式 -->
    <link rel="stylesheet" href="/echop/resources/css/style.css">
    
    <!-- 引入 Bootstrap 框架 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- =============================================
         頁面導航欄
         ============================================= -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <!-- 網站標題 -->
            <a class="navbar-brand" href="/echop/">
                <i class="fas fa-store"></i> EShop 系統
            </a>
            
            <!-- 響應式導航按鈕 -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- 導航選單 -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/echop/">首頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/echop/products/home">商品展示</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/echop/categories">商品分類</a>
                    </li>
                </ul>
                
                <!-- 用戶操作區域 -->
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/echop/auth/login">
                            <i class="fas fa-sign-in-alt"></i> 登錄
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/echop/auth/register">
                            <i class="fas fa-user-plus"></i> 註冊
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- =============================================
         主要內容區域
         ============================================= -->
    <div class="container mt-4">
        <!-- 頁面標題 -->
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="display-4 text-center">
                    <i class="fas fa-tags"></i> 商品分類
                </h1>
                <p class="text-center text-muted">瀏覽我們精選的商品分類</p>
            </div>
        </div>

        <!-- =============================================
             分類展示區域
         ============================================= -->
        <div class="row">
            <!-- 分類卡片 -->
            <div class="col-md-4 col-lg-3 mb-4">
                <div class="card h-100 category-card">
                    <div class="card-body text-center">
                        <i class="fas fa-mobile-alt fa-3x text-primary mb-3"></i>
                        <h5 class="card-title">手機</h5>
                        <p class="card-text text-muted">最新款智能手機</p>
                        <a href="/echop/products/home?category=手機" class="btn btn-primary">
                            <i class="fas fa-eye"></i> 查看商品
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 col-lg-3 mb-4">
                <div class="card h-100 category-card">
                    <div class="card-body text-center">
                        <i class="fas fa-laptop fa-3x text-success mb-3"></i>
                        <h5 class="card-title">筆記本電腦</h5>
                        <p class="card-text text-muted">高性能筆記本電腦</p>
                        <a href="/echop/products/home?category=筆記本電腦" class="btn btn-success">
                            <i class="fas fa-eye"></i> 查看商品
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 col-lg-3 mb-4">
                <div class="card h-100 category-card">
                    <div class="card-body text-center">
                        <i class="fas fa-running fa-3x text-warning mb-3"></i>
                        <h5 class="card-title">運動鞋</h5>
                        <p class="card-text text-muted">舒適運動鞋</p>
                        <a href="/echop/products/home?category=運動鞋" class="btn btn-warning">
                            <i class="fas fa-eye"></i> 查看商品
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 col-lg-3 mb-4">
                <div class="card h-100 category-card">
                    <div class="card-body text-center">
                        <i class="fas fa-headphones fa-3x text-info mb-3"></i>
                        <h5 class="card-title">音頻設備</h5>
                        <p class="card-text text-muted">高品質音頻設備</p>
                        <a href="/echop/products/home?category=音頻設備" class="btn btn-info">
                            <i class="fas fa-eye"></i> 查看商品
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- =============================================
         頁腳
         ============================================= -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>EShop 系統</h5>
                    <p class="text-muted">提供優質的商品和服務</p>
                </div>
                <div class="col-md-6 text-end">
                    <p class="text-muted">&copy; 2024 EShop 系統. 版權所有.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- =============================================
         JavaScript 引入
         ============================================= -->
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
