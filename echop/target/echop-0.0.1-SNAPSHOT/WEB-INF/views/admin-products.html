<!DOCTYPE html>
<!-- =============================================
     管理員商品管理頁面
     創建時間: 2024
     功能: 商品管理、新增、編輯、刪除商品
     ============================================= -->
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- 頁面基本設定 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 - EShop 管理員後台</title>
    
    <!-- 引入 CSS 樣式 -->
    <link rel="stylesheet" th:href="@{/resources/css/style.css}">
    <link rel="stylesheet" th:href="@{/resources/css/admin.css}">
    
    <!-- 引入 Bootstrap 框架 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- =============================================
         管理員導航欄
         ============================================= -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <!-- 管理員標題 -->
            <a class="navbar-brand" href="/admin">
                <i class="fas fa-cogs"></i> EShop 管理員後台
            </a>
            
            <!-- 響應式導航按鈕 -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- 管理員導航選單 -->
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin">儀表板</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/products">商品管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/categories">分類管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/users">用戶管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/orders">訂單管理</a>
                    </li>
                </ul>
                
                <!-- 管理員操作區域 -->
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-shield"></i> 管理員
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/admin/profile">個人資料</a></li>
                            <li><a class="dropdown-item" href="/admin/settings">系統設定</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">登出</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- =============================================
         主要內容區域
         ============================================= -->
    <div class="container-fluid mt-4">
        <!-- 頁面標題和操作按鈕 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <h2 class="mb-0">
                    <i class="fas fa-boxes"></i> 商品管理
                </h2>
                <p class="text-muted">管理所有商品資訊</p>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-primary" onclick="showAddProductModal()">
                    <i class="fas fa-plus"></i> 新增商品
                </button>
                <button class="btn btn-success" onclick="exportProducts()">
                    <i class="fas fa-download"></i> 匯出商品
                </button>
            </div>
        </div>

        <!-- =============================================
             搜索和篩選區域
             ============================================= -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <!-- 搜索框 -->
                            <div class="col-md-4 mb-3">
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-search"></i>
                                    </span>
                                    <input type="text" class="form-control" id="searchInput" placeholder="搜索商品名稱、SKU或描述...">
                                    <button class="btn btn-outline-primary" type="button" id="searchBtn">
                                        搜索
                                    </button>
                                </div>
                            </div>
                            
                            <!-- 分類篩選 -->
                            <div class="col-md-2 mb-3">
                                <select class="form-select" id="categoryFilter">
                                    <option value="">所有分類</option>
                                    <!-- 分類選項將由 JavaScript 動態載入 -->
                                </select>
                            </div>
                            
                            <!-- 狀態篩選 -->
                            <div class="col-md-2 mb-3">
                                <select class="form-select" id="statusFilter">
                                    <option value="">所有狀態</option>
                                    <option value="active">上架中</option>
                                    <option value="inactive">已下架</option>
                                    <option value="draft">草稿</option>
                                </select>
                            </div>
                            
                            <!-- 庫存篩選 -->
                            <div class="col-md-2 mb-3">
                                <select class="form-select" id="stockFilter">
                                    <option value="">所有庫存</option>
                                    <option value="in_stock">有庫存</option>
                                    <option value="low_stock">庫存不足</option>
                                    <option value="out_of_stock">缺貨</option>
                                </select>
                            </div>
                            
                            <!-- 批量操作 -->
                            <div class="col-md-2 mb-3">
                                <div class="btn-group" role="group">
                                    <button type="button" class="btn btn-outline-secondary" id="selectAllBtn">
                                        <i class="fas fa-check-square"></i> 全選
                                    </button>
                                    <button type="button" class="btn btn-outline-warning" id="batchUpdateBtn" disabled>
                                        <i class="fas fa-edit"></i> 批量編輯
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- =============================================
             商品列表表格
             ============================================= -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">商品列表</h5>
                        <div class="d-flex align-items-center">
                            <span class="me-3">顯示:</span>
                            <select class="form-select form-select-sm" id="pageSizeSelect" style="width: auto;">
                                <option value="10">10</option>
                                <option value="25" selected>25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="card-body p-0">
                        <!-- 載入指示器 -->
                        <div id="loadingIndicator" class="text-center py-5" style="display: none;">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">載入中...</span>
                            </div>
                            <p class="mt-2">正在載入商品...</p>
                        </div>
                        
                        <!-- 商品表格 -->
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th width="50">
                                            <input type="checkbox" id="selectAllCheckbox" class="form-check-input">
                                        </th>
                                        <th width="80">圖片</th>
                                        <th>商品名稱</th>
                                        <th width="120">分類</th>
                                        <th width="100">價格</th>
                                        <th width="80">庫存</th>
                                        <th width="100">狀態</th>
                                        <th width="120">創建者</th>
                                        <th width="150">創建時間</th>
                                        <th width="150">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="productTableBody">
                                    <!-- 商品行將由 JavaScript 動態生成 -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- 無商品提示 -->
                        <div id="noProductsMessage" class="text-center py-5" style="display: none;">
                            <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                            <h4 class="text-muted">暫無商品</h4>
                            <p class="text-muted">點擊「新增商品」按鈕開始添加商品</p>
                        </div>
                    </div>
                    
                    <!-- 分頁導航 -->
                    <div class="card-footer">
                        <nav aria-label="商品分頁">
                            <ul class="pagination justify-content-center mb-0" id="pagination">
                                <!-- 分頁按鈕將由 JavaScript 動態生成 -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- =============================================
         新增/編輯商品模態框
         ============================================= -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">新增商品</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                
                <form id="productForm" enctype="multipart/form-data">
                    <div class="modal-body">
                        <div class="row">
                            <!-- 基本資訊 -->
                            <div class="col-md-8">
                                <div class="card">
                                    <div class="card-header">
                                        <h6 class="mb-0">基本資訊</h6>
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <!-- 商品名稱 -->
                                            <div class="col-md-6 mb-3">
                                                <label for="productName" class="form-label">商品名稱 *</label>
                                                <input type="text" class="form-control" id="productName" name="product_name" required>
                                            </div>
                                            
                                            <!-- SKU -->
                                            <div class="col-md-6 mb-3">
                                                <label for="productSku" class="form-label">SKU</label>
                                                <input type="text" class="form-control" id="productSku" name="sku">
                                            </div>
                                            
                                            <!-- 商品描述 -->
                                            <div class="col-12 mb-3">
                                                <label for="productDescription" class="form-label">商品描述</label>
                                                <textarea class="form-control" id="productDescription" name="description" rows="4"></textarea>
                                            </div>
                                            
                                            <!-- 價格 -->
                                            <div class="col-md-4 mb-3">
                                                <label for="productPrice" class="form-label">價格 *</label>
                                                <div class="input-group">
                                                    <span class="input-group-text">$</span>
                                                    <input type="number" class="form-control" id="productPrice" name="price" step="0.01" min="0" required>
                                                </div>
                                            </div>
                                            
                                            <!-- 庫存數量 -->
                                            <div class="col-md-4 mb-3">
                                                <label for="productStock" class="form-label">庫存數量</label>
                                                <input type="number" class="form-control" id="productStock" name="stock_quantity" min="0" value="0">
                                            </div>
                                            
                                            <!-- 商品狀態 -->
                                            <div class="col-md-4 mb-3">
                                                <label for="productStatus" class="form-label">商品狀態</label>
                                                <select class="form-select" id="productStatus" name="status">
                                                    <option value="draft">草稿</option>
                                                    <option value="active">上架</option>
                                                    <option value="inactive">下架</option>
                                                </select>
                                            </div>
                                            
                                            <!-- 分類 -->
                                            <div class="col-md-6 mb-3">
                                                <label for="productCategory" class="form-label">商品分類 *</label>
                                                <select class="form-select" id="productCategory" name="category_id" required>
                                                    <option value="">請選擇分類</option>
                                                    <!-- 分類選項將由 JavaScript 動態載入 -->
                                                </select>
                                            </div>
                                            
                                            <!-- 品牌 -->
                                            <div class="col-md-6 mb-3">
                                                <label for="productBrand" class="form-label">品牌</label>
                                                <input type="text" class="form-control" id="productBrand" name="brand">
                                            </div>
                                            
                                            <!-- 重量 -->
                                            <div class="col-md-4 mb-3">
                                                <label for="productWeight" class="form-label">重量 (克)</label>
                                                <input type="number" class="form-control" id="productWeight" name="weight" step="0.01" min="0">
                                            </div>
                                            
                                            <!-- 尺寸 -->
                                            <div class="col-md-4 mb-3">
                                                <label for="productDimensions" class="form-label">尺寸 (長x寬x高)</label>
                                                <input type="text" class="form-control" id="productDimensions" name="dimensions" placeholder="例如: 10x5x3">
                                            </div>
                                            
                                            <!-- 排序 -->
                                            <div class="col-md-4 mb-3">
                                                <label for="productSortOrder" class="form-label">排序</label>
                                                <input type="number" class="form-control" id="productSortOrder" name="sort_order" min="0" value="0">
                                            </div>
                                            
                                            <!-- 標籤 -->
                                            <div class="col-12 mb-3">
                                                <label for="productTags" class="form-label">標籤 (用逗號分隔)</label>
                                                <input type="text" class="form-control" id="productTags" name="tags" placeholder="例如: 熱銷, 新品, 限時優惠">
                                            </div>
                                            
                                            <!-- 特色商品 -->
                                            <div class="col-12 mb-3">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" id="productFeatured" name="is_featured">
                                                    <label class="form-check-label" for="productFeatured">
                                                        設為特色商品
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 圖片上傳 -->
                            <div class="col-md-4">
                                <div class="card">
                                    <div class="card-header">
                                        <h6 class="mb-0">商品圖片</h6>
                                    </div>
                                    <div class="card-body">
                                        <!-- 主圖片 -->
                                        <div class="mb-3">
                                            <label for="mainImage" class="form-label">主圖片</label>
                                            <input type="file" class="form-control" id="mainImage" name="main_image" accept="image/*">
                                            <div class="form-text">建議尺寸: 800x800px，支援 JPG、PNG、GIF 格式</div>
                                        </div>
                                        
                                        <!-- 圖片預覽 -->
                                        <div id="imagePreview" class="text-center" style="display: none;">
                                            <img id="previewImg" src="" class="img-fluid rounded" style="max-height: 200px;">
                                        </div>
                                        
                                        <!-- 額外圖片 -->
                                        <div class="mb-3">
                                            <label for="additionalImages" class="form-label">額外圖片</label>
                                            <input type="file" class="form-control" id="additionalImages" name="additional_images" multiple accept="image/*">
                                            <div class="form-text">可選擇多張圖片</div>
                                        </div>
                                        
                                        <!-- 圖片列表 -->
                                        <div id="additionalImagesPreview" class="row">
                                            <!-- 額外圖片預覽將由 JavaScript 動態生成 -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary" id="saveProductBtn">
                            <i class="fas fa-save"></i> 儲存商品
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- =============================================
         刪除確認模態框
         ============================================= -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">確認刪除</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>您確定要刪除此商品嗎？</p>
                    <p class="text-danger"><strong>注意：此操作無法復原！</strong></p>
                    <div id="deleteProductInfo"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                        <i class="fas fa-trash"></i> 確認刪除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- =============================================
         JavaScript 引入
         ============================================= -->
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 管理員商品管理 JavaScript -->
    <script>
        // =============================================
        // 管理員商品管理頁面 JavaScript
        // =============================================
        
        // 全域變數
        let currentPage = 1;
        let pageSize = 25;
        let currentFilters = {
            search: '',
            category: '',
            status: '',
            stock: ''
        };
        let selectedProducts = new Set();
        let currentProductId = null;
        
        // 頁面載入完成後初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('管理員商品管理頁面載入完成');
            
            // 初始化事件監聽器
            initializeEventListeners();
            
            // 載入分類選項
            loadCategories();
            
            // 載入商品列表
            loadProducts();
        });
        
        // =============================================
        // 事件監聽器初始化
        // =============================================
        function initializeEventListeners() {
            console.log('初始化事件監聽器');
            
            // 搜索按鈕點擊事件
            document.getElementById('searchBtn').addEventListener('click', function() {
                console.log('搜索按鈕被點擊');
                performSearch();
            });
            
            // 搜索框回車事件
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    console.log('搜索框回車事件');
                    performSearch();
                }
            });
            
            // 篩選器變更事件
            document.getElementById('categoryFilter').addEventListener('change', function() {
                console.log('分類篩選變更:', this.value);
                currentFilters.category = this.value;
                loadProducts();
            });
            
            document.getElementById('statusFilter').addEventListener('change', function() {
                console.log('狀態篩選變更:', this.value);
                currentFilters.status = this.value;
                loadProducts();
            });
            
            document.getElementById('stockFilter').addEventListener('change', function() {
                console.log('庫存篩選變更:', this.value);
                currentFilters.stock = this.value;
                loadProducts();
            });
            
            // 頁面大小變更事件
            document.getElementById('pageSizeSelect').addEventListener('change', function() {
                console.log('頁面大小變更:', this.value);
                pageSize = parseInt(this.value);
                currentPage = 1;
                loadProducts();
            });
            
            // 全選按鈕事件
            document.getElementById('selectAllCheckbox').addEventListener('change', function() {
                console.log('全選狀態變更:', this.checked);
                toggleSelectAll(this.checked);
            });
            
            // 批量操作按鈕事件
            document.getElementById('batchUpdateBtn').addEventListener('click', function() {
                console.log('批量編輯按鈕被點擊');
                showBatchUpdateModal();
            });
            
            // 商品表單提交事件
            document.getElementById('productForm').addEventListener('submit', function(e) {
                e.preventDefault();
                console.log('商品表單提交');
                saveProduct();
            });
            
            // 主圖片預覽事件
            document.getElementById('mainImage').addEventListener('change', function(e) {
                console.log('主圖片變更');
                previewMainImage(e.target.files[0]);
            });
            
            // 額外圖片預覽事件
            document.getElementById('additionalImages').addEventListener('change', function(e) {
                console.log('額外圖片變更');
                previewAdditionalImages(e.target.files);
            });
        }
        
        // =============================================
        // 搜索功能
        // =============================================
        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            console.log('執行搜索:', searchTerm);
            
            currentFilters.search = searchTerm;
            currentPage = 1; // 重置到第一頁
            loadProducts();
        }
        
        // =============================================
        // 載入分類選項
        // =============================================
        function loadCategories() {
            console.log('載入分類選項');
            
            // 模擬 API 調用
            fetch('/api/categories')
                .then(response => response.json())
                .then(data => {
                    console.log('分類資料載入成功:', data);
                    
                    const categorySelects = [
                        document.getElementById('categoryFilter'),
                        document.getElementById('productCategory')
                    ];
                    
                    categorySelects.forEach(select => {
                        // 清空現有選項（保留預設選項）
                        const defaultOption = select.querySelector('option[value=""]');
                        select.innerHTML = '';
                        if (defaultOption) {
                            select.appendChild(defaultOption);
                        }
                        
                        // 添加分類選項
                        if (data.success && data.categories) {
                            data.categories.forEach(category => {
                                const option = document.createElement('option');
                                option.value = category.category_id;
                                option.textContent = category.category_name;
                                select.appendChild(option);
                            });
                        }
                    });
                })
                .catch(error => {
                    console.error('載入分類失敗:', error);
                });
        }
        
        // =============================================
        // 載入商品列表
        // =============================================
        function loadProducts() {
            console.log('載入商品列表 - 頁碼:', currentPage, '篩選條件:', currentFilters);
            
            // 顯示載入指示器
            showLoadingIndicator();
            
            // 構建查詢參數
            const params = new URLSearchParams({
                page: currentPage,
                pageSize: pageSize,
                search: currentFilters.search,
                category: currentFilters.category,
                status: currentFilters.status,
                stock: currentFilters.stock
            });
            
            // 模擬 API 調用
            fetch(`/api/admin/products?${params}`)
                .then(response => response.json())
                .then(data => {
                    console.log('商品資料載入成功:', data);
                    
                    // 隱藏載入指示器
                    hideLoadingIndicator();
                    
                    if (data.success) {
                        displayProducts(data.products);
                        updatePagination(data.total_pages, data.page);
                    } else {
                        showNoProductsMessage();
                    }
                })
                .catch(error => {
                    console.error('載入商品失敗:', error);
                    hideLoadingIndicator();
                    showErrorMessage('載入商品時發生錯誤');
                });
        }
        
        // =============================================
        // 顯示商品列表
        // =============================================
        function displayProducts(products) {
            console.log('顯示商品列表:', products.length, '個');
            
            if (products.length === 0) {
                showNoProductsMessage();
                return;
            }
            
            // 隱藏無商品訊息
            document.getElementById('noProductsMessage').style.display = 'none';
            
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';
            
            products.forEach(product => {
                const row = createProductRow(product);
                tbody.appendChild(row);
            });
        }
        
        // =============================================
        // 創建商品行
        // =============================================
        function createProductRow(product) {
            console.log('創建商品行:', product.product_name);
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>
                    <input type="checkbox" class="form-check-input product-checkbox" 
                           value="${product.product_id}" onchange="toggleProductSelection(${product.product_id})">
                </td>
                <td>
                    <img src="${product.main_image || '/resources/img/placeholder.jpg'}" 
                         class="img-thumbnail" style="width: 50px; height: 50px; object-fit: cover;"
                         alt="${product.product_name}"
                         onerror="this.src='/resources/img/placeholder.jpg'">
                </td>
                <td>
                    <div class="fw-bold">${product.product_name}</div>
                    <small class="text-muted">${product.sku || '無SKU'}</small>
                </td>
                <td>
                    <span class="badge bg-primary">${product.category_name}</span>
                </td>
                <td>
                    <span class="fw-bold text-danger">$${product.price}</span>
                </td>
                <td>
                    <span class="badge ${getStockBadgeClass(product.stock_quantity)}">${product.stock_quantity}</span>
                </td>
                <td>
                    <span class="badge ${getStatusBadgeClass(product.status)}">${getStatusText(product.status)}</span>
                </td>
                <td>
                    <small>${product.created_by_username}</small>
                </td>
                <td>
                    <small>${formatDate(product.created_at)}</small>
                </td>
                <td>
                    <div class="btn-group btn-group-sm" role="group">
                        <button class="btn btn-outline-primary" onclick="editProduct(${product.product_id})" title="編輯">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-outline-info" onclick="viewProduct(${product.product_id})" title="查看">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-outline-danger" onclick="deleteProduct(${product.product_id})" title="刪除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </td>
            `;
            
            return row;
        }
        
        // =============================================
        // 顯示新增商品模態框
        // =============================================
        function showAddProductModal() {
            console.log('顯示新增商品模態框');
            
            // 重置表單
            document.getElementById('productForm').reset();
            document.getElementById('modalTitle').textContent = '新增商品';
            document.getElementById('saveProductBtn').innerHTML = '<i class="fas fa-save"></i> 儲存商品';
            
            // 隱藏圖片預覽
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('additionalImagesPreview').innerHTML = '';
            
            // 顯示模態框
            const modal = new bootstrap.Modal(document.getElementById('productModal'));
            modal.show();
        }
        
        // =============================================
        // 編輯商品
        // =============================================
        function editProduct(productId) {
            console.log('編輯商品:', productId);
            
            // 載入商品資料
            fetch(`/api/admin/products/${productId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        fillProductForm(data.product);
                        
                        // 更新模態框標題
                        document.getElementById('modalTitle').textContent = '編輯商品';
                        document.getElementById('saveProductBtn').innerHTML = '<i class="fas fa-save"></i> 更新商品';
                        
                        // 顯示模態框
                        const modal = new bootstrap.Modal(document.getElementById('productModal'));
                        modal.show();
                    } else {
                        showErrorMessage('載入商品資料失敗');
                    }
                })
                .catch(error => {
                    console.error('載入商品資料失敗:', error);
                    showErrorMessage('載入商品資料時發生錯誤');
                });
        }
        
        // =============================================
        // 填充商品表單
        // =============================================
        function fillProductForm(product) {
            console.log('填充商品表單:', product.product_name);
            
            // 填充基本資訊
            document.getElementById('productName').value = product.product_name || '';
            document.getElementById('productSku').value = product.sku || '';
            document.getElementById('productDescription').value = product.description || '';
            document.getElementById('productPrice').value = product.price || '';
            document.getElementById('productStock').value = product.stock_quantity || 0;
            document.getElementById('productStatus').value = product.status || 'draft';
            document.getElementById('productCategory').value = product.category_id || '';
            document.getElementById('productBrand').value = product.brand || '';
            document.getElementById('productWeight').value = product.weight || '';
            document.getElementById('productDimensions').value = product.dimensions || '';
            document.getElementById('productSortOrder').value = product.sort_order || 0;
            document.getElementById('productTags').value = product.tags || '';
            document.getElementById('productFeatured').checked = product.is_featured || false;
            
            // 顯示主圖片預覽
            if (product.main_image) {
                document.getElementById('previewImg').src = product.main_image;
                document.getElementById('imagePreview').style.display = 'block';
            }
        }
        
        // =============================================
        // 儲存商品
        // =============================================
        function saveProduct() {
            console.log('儲存商品');
            
            const formData = new FormData(document.getElementById('productForm'));
            const isEdit = document.getElementById('modalTitle').textContent === '編輯商品';
            
            // 顯示載入狀態
            const saveBtn = document.getElementById('saveProductBtn');
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 儲存中...';
            saveBtn.disabled = true;
            
            // 構建 API URL
            const url = isEdit ? `/api/admin/products/${currentProductId}` : '/api/admin/products';
            const method = isEdit ? 'PUT' : 'POST';
            
            // 發送請求
            fetch(url, {
                method: method,
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    console.log('商品儲存成功');
                    showSuccessMessage(isEdit ? '商品更新成功' : '商品新增成功');
                    
                    // 關閉模態框
                    const modal = bootstrap.Modal.getInstance(document.getElementById('productModal'));
                    modal.hide();
                    
                    // 重新載入商品列表
                    loadProducts();
                } else {
                    showErrorMessage(data.message || '儲存商品失敗');
                }
            })
            .catch(error => {
                console.error('儲存商品失敗:', error);
                showErrorMessage('儲存商品時發生錯誤');
            })
            .finally(() => {
                // 恢復按鈕狀態
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            });
        }
        
        // =============================================
        // 刪除商品
        // =============================================
        function deleteProduct(productId) {
            console.log('刪除商品:', productId);
            
            currentProductId = productId;
            
            // 載入商品資訊用於確認
            fetch(`/api/admin/products/${productId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // 顯示刪除確認資訊
                        const productInfo = document.getElementById('deleteProductInfo');
                        productInfo.innerHTML = `
                            <div class="alert alert-warning">
                                <strong>商品名稱:</strong> ${data.product.product_name}<br>
                                <strong>SKU:</strong> ${data.product.sku || '無'}<br>
                                <strong>價格:</strong> $${data.product.price}
                            </div>
                        `;
                        
                        // 顯示刪除確認模態框
                        const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
                        modal.show();
                    } else {
                        showErrorMessage('載入商品資料失敗');
                    }
                })
                .catch(error => {
                    console.error('載入商品資料失敗:', error);
                    showErrorMessage('載入商品資料時發生錯誤');
                });
        }
        
        // =============================================
        // 確認刪除商品
        // =============================================
        function confirmDeleteProduct() {
            console.log('確認刪除商品:', currentProductId);
            
            // 顯示載入狀態
            const deleteBtn = document.getElementById('confirmDeleteBtn');
            const originalText = deleteBtn.innerHTML;
            deleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刪除中...';
            deleteBtn.disabled = true;
            
            // 發送刪除請求
            fetch(`/api/admin/products/${currentProductId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    console.log('商品刪除成功');
                    showSuccessMessage('商品刪除成功');
                    
                    // 關閉模態框
                    const modal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
                    modal.hide();
                    
                    // 重新載入商品列表
                    loadProducts();
                } else {
                    showErrorMessage(data.message || '刪除商品失敗');
                }
            })
            .catch(error => {
                console.error('刪除商品失敗:', error);
                showErrorMessage('刪除商品時發生錯誤');
            })
            .finally(() => {
                // 恢復按鈕狀態
                deleteBtn.innerHTML = originalText;
                deleteBtn.disabled = false;
            });
        }
        
        // =============================================
        // 圖片預覽功能
        // =============================================
        function previewMainImage(file) {
            console.log('預覽主圖片');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('imagePreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
        
        function previewAdditionalImages(files) {
            console.log('預覽額外圖片:', files.length, '個');
            
            const previewContainer = document.getElementById('additionalImagesPreview');
            previewContainer.innerHTML = '';
            
            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const col = document.createElement('div');
                    col.className = 'col-md-4 mb-2';
                    col.innerHTML = `
                        <div class="position-relative">
                            <img src="${e.target.result}" class="img-fluid rounded" style="height: 100px; object-fit: cover;">
                            <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0" 
                                    onclick="removeImagePreview(this)">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    `;
                    previewContainer.appendChild(col);
                };
                reader.readAsDataURL(file);
            });
        }
        
        // =============================================
        // 輔助函數
        // =============================================
        
        // 顯示載入指示器
        function showLoadingIndicator() {
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('productTableBody').style.display = 'none';
            document.getElementById('noProductsMessage').style.display = 'none';
        }
        
        // 隱藏載入指示器
        function hideLoadingIndicator() {
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('productTableBody').style.display = 'table-row-group';
        }
        
        // 顯示無商品訊息
        function showNoProductsMessage() {
            document.getElementById('noProductsMessage').style.display = 'block';
            document.getElementById('productTableBody').style.display = 'none';
        }
        
        // 顯示成功訊息
        function showSuccessMessage(message) {
            console.log('成功訊息:', message);
            // 這裡可以添加成功提示的 UI 實現
            alert(message);
        }
        
        // 顯示錯誤訊息
        function showErrorMessage(message) {
            console.error('錯誤訊息:', message);
            // 這裡可以添加錯誤提示的 UI 實現
            alert(message);
        }
        
        // 獲取庫存徽章樣式
        function getStockBadgeClass(stock) {
            if (stock === 0) return 'bg-danger';
            if (stock < 10) return 'bg-warning';
            return 'bg-success';
        }
        
        // 獲取狀態徽章樣式
        function getStatusBadgeClass(status) {
            switch (status) {
                case 'active': return 'bg-success';
                case 'inactive': return 'bg-danger';
                case 'draft': return 'bg-warning';
                default: return 'bg-secondary';
            }
        }
        
        // 獲取狀態文字
        function getStatusText(status) {
            switch (status) {
                case 'active': return '上架中';
                case 'inactive': return '已下架';
                case 'draft': return '草稿';
                default: return '未知';
            }
        }
        
        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-TW');
        }
        
        // 更新分頁
        function updatePagination(totalPages, currentPageNum) {
            console.log('更新分頁 - 總頁數:', totalPages, '當前頁:', currentPageNum);
            
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            if (totalPages <= 1) return;
            
            // 上一頁按鈕
            const prevLi = document.createElement('li');
            prevLi.className = `page-item ${currentPageNum === 1 ? 'disabled' : ''}`;
            prevLi.innerHTML = `<a class="page-link" href="#" onclick="changePage(${currentPageNum - 1})">上一頁</a>`;
            pagination.appendChild(prevLi);
            
            // 頁碼按鈕
            for (let i = 1; i <= totalPages; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === currentPageNum ? 'active' : ''}`;
                li.innerHTML = `<a class="page-link" href="#" onclick="changePage(${i})">${i}</a>`;
                pagination.appendChild(li);
            }
            
            // 下一頁按鈕
            const nextLi = document.createElement('li');
            nextLi.className = `page-item ${currentPageNum === totalPages ? 'disabled' : ''}`;
            nextLi.innerHTML = `<a class="page-link" href="#" onclick="changePage(${currentPageNum + 1})">下一頁</a>`;
            pagination.appendChild(nextLi);
        }
        
        // 切換頁面
        function changePage(page) {
            console.log('切換到頁面:', page);
            
            if (page < 1) return;
            
            currentPage = page;
            loadProducts();
            
            // 滾動到頂部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // 全選功能
        function toggleSelectAll(checked) {
            console.log('全選狀態:', checked);
            
            const checkboxes = document.querySelectorAll('.product-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = checked;
                const productId = parseInt(checkbox.value);
                if (checked) {
                    selectedProducts.add(productId);
                } else {
                    selectedProducts.delete(productId);
                }
            });
            
            updateBatchOperationButtons();
        }
        
        // 切換商品選擇
        function toggleProductSelection(productId) {
            console.log('切換商品選擇:', productId);
            
            if (selectedProducts.has(productId)) {
                selectedProducts.delete(productId);
            } else {
                selectedProducts.add(productId);
            }
            
            updateBatchOperationButtons();
        }
        
        // 更新批量操作按鈕
        function updateBatchOperationButtons() {
            const batchBtn = document.getElementById('batchUpdateBtn');
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            
            if (selectedProducts.size > 0) {
                batchBtn.disabled = false;
                batchBtn.textContent = `批量編輯 (${selectedProducts.size})`;
            } else {
                batchBtn.disabled = true;
                batchBtn.textContent = '批量編輯';
            }
            
            // 更新全選狀態
            const totalCheckboxes = document.querySelectorAll('.product-checkbox').length;
            const checkedCheckboxes = document.querySelectorAll('.product-checkbox:checked').length;
            
            if (checkedCheckboxes === 0) {
                selectAllCheckbox.indeterminate = false;
                selectAllCheckbox.checked = false;
            } else if (checkedCheckboxes === totalCheckboxes) {
                selectAllCheckbox.indeterminate = false;
                selectAllCheckbox.checked = true;
            } else {
                selectAllCheckbox.indeterminate = true;
            }
        }
        
        // 顯示批量編輯模態框
        function showBatchUpdateModal() {
            console.log('顯示批量編輯模態框');
            // 這裡可以實現批量編輯功能
            alert('批量編輯功能開發中...');
        }
        
        // 匯出商品
        function exportProducts() {
            console.log('匯出商品');
            // 這裡可以實現商品匯出功能
            alert('商品匯出功能開發中...');
        }
        
        // 查看商品詳情
        function viewProduct(productId) {
            console.log('查看商品詳情:', productId);
            // 這裡可以實現商品詳情查看功能
            window.open(`/products/${productId}`, '_blank');
        }
        
        // 移除圖片預覽
        function removeImagePreview(button) {
            console.log('移除圖片預覽');
            button.closest('.col-md-4').remove();
        }
        
        // 確認刪除按鈕事件
        document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDeleteProduct);
    </script>
</body>
</html>
