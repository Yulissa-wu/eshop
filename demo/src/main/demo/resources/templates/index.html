
<!DOCTYPE html>
<html lang="zh-TW">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>產品管理系統</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
       .error-message { color: #dc3545; font-size: 0.875em; }
       .is-invalid { border-color: #dc3545; }
   </style>
</head>
<body class="container py-4">
   <h1 class="mb-4">產品管理系統</h1>
  
   <!-- 訊息顯示區 -->
   <div id="successContainer"></div>
   <div id="errorContainer"></div>
  
   <!-- 產品表單 -->
   <div class="card mb-4">
       <div class="card-header">
           <h5 id="formTitle">新增產品</h5>
       </div>
       <div class="card-body">
           <form id="productForm">
               <div class="mb-3">
                   <label for="name" class="form-label">產品名稱</label>
                   <input type="text" class="form-control" id="name" required>
               </div>
               <div class="mb-3">
                   <label for="description" class="form-label">產品描述</label>
                   <textarea class="form-control" id="description" rows="2"></textarea>
               </div>
               <div class="mb-3">
                   <label for="price" class="form-label">價格</label>
                   <input type="number" class="form-control" id="price" min="0" step="0.01" required>
               </div>
               <button type="submit" id="submitBtn" class="btn btn-primary">儲存</button>
               <button type="button" class="btn btn-secondary ms-2" onclick="clearForm()">取消</button>
           </form>
       </div>
   </div>
  
   <!-- 產品列表 -->
   <div class="card">
       <div class="card-header">
           <h5>產品列表</h5>
       </div>
       <div class="card-body">
           <div class="table-responsive">
               <table class="table table-striped">
                   <thead>
                       <tr>
                           <th>產品名稱</th>
                           <th>描述</th>
                           <th>價格</th>
                           <th>功能</th>
                       </tr>
                   </thead>
                   <tbody id="productList">
                       <tr>
                           <td colspan="4" class="text-center">載入中...</td>
                       </tr>
                   </tbody>
               </table>
           </div>
       </div>
   </div>
   <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   <script src="/js/app.js"></script>
</body>
</html>
