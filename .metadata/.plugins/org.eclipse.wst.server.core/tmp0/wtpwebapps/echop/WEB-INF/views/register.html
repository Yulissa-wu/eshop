<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>註冊帳號</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container mt-5">
		<div class="card shadow mx-auto" style="max-width: 400px;">
			<div class="card-body">
				<h3 class="text-center mb-3">註冊帳號</h3>
				<form th:action="@{/auth/register}" method="post"
					th:object="${user}">
					<div class="mb-3">
						<form th:action="@{/auth/register}" method="post"
							th:object="${user}">
							<div class="mb-3">
								<label for="name" class="form-label">姓名</label> <input
									type="text" id="name" th:field="*{name}" class="form-control"
									required>
							</div>

							<div class="mb-3">
								<label for="email" class="form-label">Email</label> <input
									type="email" id="email" th:field="*{email}"
									class="form-control" required
									pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
									title="請輸入正確 Email 格式，例：abc@domain.com">
							</div>

							<div class="mb-3">
								<label for="password" class="form-label">密碼</label> <input
									type="password" id="password" th:field="*{password}"
									class="form-control" required
									pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
									title="密碼至少 8 字元，包含大小寫字母、數字和符號">
							</div>

							<button type="submit" class="btn btn-primary">註冊</button>
						</form>
						<div th:if="${error}" class="text-danger mt-2" th:text="${error}"></div>
				</form>
				<div class="text-center mt-3">
					<a th:href="@{/auth/login}">已有帳號？登入</a>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
