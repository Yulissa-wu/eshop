<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單查詢 | E-Shop</title>
    <!-- Bootstrap 樣式表 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自訂 CSS -->
    <link rel="stylesheet" href="/css/order-list.css">
</head>
<body>
    <!-- 導覽列區塊 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">E-Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/products">商品列表</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cart">購物車</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/orders">訂單查詢</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout">登出</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主內容區 -->
    <div class="container mt-5">
        <h2 class="text-center mb-4">我的訂單查詢</h2>

        <!-- 訂單清單表格 -->
        <table class="table table-hover align-middle shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>訂單編號</th>
                    <th>下單日期</th>
                    <th>總金額</th>
                    <th>狀態</th>
                    <th>詳細內容</th>
                </tr>
            </thead>
            <tbody>
                <!-- Thymeleaf 迴圈載入訂單 -->
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}">10001</td>
                    <td th:text="${#dates.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2025-10-27 13:30</td>
                    <td th:text="${order.totalPrice}">1200</td>
                    <td>
                        <span th:text="${order.status}"
                              th:classappend="${order.status == '已完成'} ? 'badge bg-success' : 'badge bg-warning text-dark'">
                            已完成
                        </span>
                    </td>
                    <td>
                        <!-- 按鈕展開詳細訂單內容 -->
                        <button class="btn btn-sm btn-primary" 
                                type="button" 
                                data-bs-toggle="collapse" 
                                th:attr="data-bs-target='#orderDetails__${order.id}'">
                            查看
                        </button>
                    </td>
                </tr>

                <!-- 詳細訂單區（展開用 collapse） -->
                <tr th:each="order : ${orders}">
                    <td colspan="5">
                        <div class="collapse mt-2" th:id="'orderDetails__' + ${order.id}">
                            <div class="card card-body">
                                <h5>訂單明細</h5>
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>商品圖片</th>
                                            <th>商品名稱</th>
                                            <th>數量</th>
                                            <th>單價</th>
                                            <th>小計</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="item : ${order.items}">
                                            <td>
                                                <img th:src="@{/uploads/{img}(img=${item.product.image})}" alt="商品圖片" width="60">
                                            </td>
                                            <td th:text="${item.product.name}">商品名稱</td>
                                            <td th:text="${item.quantity}">1</td>
                                            <td th:text="${item.product.price}">100</td>
                                            <td th:text="${item.quantity * item.product.price}">100</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div class="text-end">
                                    <strong>總計：</strong>
                                    <span th:text="${order.totalPrice}">1200</span> 元
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>

                <!-- 若沒有訂單 -->
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="5" class="text-center text-muted">目前沒有訂單。</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
