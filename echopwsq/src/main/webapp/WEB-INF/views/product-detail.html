<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.prod_name}">商品詳情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <a href="/" class="btn btn-link mb-3">&larr; 返回首頁</a>

    <div class="row">
        <!-- 商品圖片 -->
        <div class="col-md-5">
            <img th:src="@{'/uploads/' + ${product.prod_image}}" class="img-fluid rounded shadow" alt="商品圖片">
        </div>
        <!-- 商品資訊 -->
        <div class="col-md-7">
            <h2 th:text="${product.prod_name}">商品名稱</h2>
            <p class="text-muted" th:text="${product.category.cate_name}">分類</p>
            <h4 class="text-danger" th:text="'$' + ${product.prod_price}">價格</h4>
            <p th:text="${product.description}">商品說明</p>
            <form th:action="@{/cart/add}" method="post" class="d-inline">
							<input type="hidden" name="productId" th:value="${product.id}" />
							<input type="hidden" name="quantity" value="1" />
							<button type="submit" class="btn btn-success btn-sm">加入購物車</button>
						</form>
        </div>
    </div>
</div>

<script src="/js/cart.js"></script>
</body>
</html>
